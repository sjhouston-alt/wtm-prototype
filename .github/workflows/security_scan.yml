name: Security Scan

on:
  push:
      branches: [main]
        pull_request:
            branches: [main]
              schedule:
                  - cron: '0 6 * * 1'

                  jobs:
                    dependency-audit:
                        name: npm audit
                            runs-on: ubuntu-latest
                                steps:
                                      - uses: actions/checkout@v4
                                            - name: Set up Node.js
                                                    uses: actions/setup-node@v4
                                                            with:
                                                                      node-version: '20'
                                                                                cache: 'npm'
                                                                                      - name: Install dependencies
                                                                                              run: npm ci
                                                                                                    - name: Run npm audit
                                                                                                            run: npm audit --audit-level=high
                                                                                                            
                                                                                                              secret-scan:
                                                                                                                  name: Secret Detection
                                                                                                                      runs-on: ubuntu-latest
                                                                                                                          steps:
                                                                                                                                - uses: actions/checkout@v4
                                                                                                                                        with:
                                                                                                                                                  fetch-depth: 0
                                                                                                                                                        - name: Run Gitleaks
                                                                                                                                                                uses: gitleaks/gitleaks-action@v2
                                                                                                                                                                        env:
                                                                                                                                                                                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                                                                  
                                                                                                                                                                                    static-analysis:
                                                                                                                                                                                        name: Static Security Analysis
                                                                                                                                                                                            runs-on: ubuntu-latest
                                                                                                                                                                                                steps:
                                                                                                                                                                                                      - uses: actions/checkout@v4
                                                                                                                                                                                                            - name: Set up Node.js
                                                                                                                                                                                                                    uses: actions/setup-node@v4
                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                      node-version: '20'
                                                                                                                                                                                                                                                cache: 'npm'
                                                                                                                                                                                                                                                      - name: Install dependencies
                                                                                                                                                                                                                                                              run: npm ci
                                                                                                                                                                                                                                                                    - name: ESLint security scan
                                                                                                                                                                                                                                                                            run: npx eslint security/ --max-warnings 0
                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                              notify-on-failure:
                                                                                                                                                                                                                                                                                  name: Notify on Security Failure
                                                                                                                                                                                                                                                                                      runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                          needs: [dependency-audit, secret-scan, static-analysis]
                                                                                                                                                                                                                                                                                              if: failure()
                                                                                                                                                                                                                                                                                                  steps:
                                                                                                                                                                                                                                                                                                        - name: Send Slack alert
                                                                                                                                                                                                                                                                                                                uses: slackapi/slack-github-action@v1.26.0
                                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                                  payload: |
                                                                                                                                                                                                                                                                                                                                              {
                                                                                                                                                                                                                                                                                                                                                            "text": "WTM Security Scan FAILED on branch ${{ github.ref_name }}"
                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                                                                                                          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
