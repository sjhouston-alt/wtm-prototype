<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<title>What's the Move</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#080810;color:#fff;font-family:'Manrope',sans-serif}
:root{
    color-scheme: dark;
  --base:#080810;--surface:#0f0f1a;--surface2:#151525;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.11);
  --text:#fff;--text2:rgba(255,255,255,.62);--text3:rgba(255,255,255,.32);
  --purple:#a855f7;--teal:#14b8a6;--pink:#ec4899;--amber:#f59e0b;--green:#22c55e;--indigo:#6366f1;
  --amethyst:#a855f7;--emerald:#10b981;--ruby:#e11d48;
  --cta:linear-gradient(135deg,#8b5cf6,#ec4899);
  --brand:linear-gradient(90deg,#c084fc,#f472b6,#fb923c);
  --tier:var(--emerald);--tier-bg:rgba(16,185,129,.08);--tier-border:rgba(16,185,129,.22);
}
[data-theme="light"]{
  --base:#FAF8F5;--surface:#F2EFE9;--surface2:#e8e4dc;--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.12);
  --text:#111018;--text2:rgba(17,16,24,.6);--text3:rgba(17,16,24,.35);
}
#wtm-app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--base)}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#screen::-webkit-scrollbar{display:none}
.bottom-nav{flex-shrink:0;display:flex;background:rgba(8,8,16,.96);border-top:1px solid var(--border);
  padding:8px 0 max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(24px)}
[data-theme="light"] .bottom-nav{background:rgba(250,248,245,.96)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;
  background:none;border:none;cursor:pointer;color:var(--text3);transition:color .15s}
.nav-btn.on{color:var(--emerald)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-btn span{font-size:10px;font-weight:700;font-family:'Manrope',sans-serif}

/* ── TOP BAR ── */
.top-bar{position:sticky;top:0;z-index:50;background:rgba(8,8,16,.96);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);padding:max(14px,env(safe-area-inset-top)) 16px 13px;
  display:flex;align-items:center;gap:10px;flex-shrink:0}
[data-theme="light"] .top-bar{background:rgba(250,248,245,.96)}
.top-bar-title{font-family:'Manrope',sans-serif;font-size:17px;font-weight:800;flex:1}
.top-back{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.top-back svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0}
.icon-btn svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:1.8}
.notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--ruby);border:1.5px solid var(--base)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#ec4899);
  border:2px solid rgba(16,185,129,.45);cursor:pointer;flex-shrink:0}

/* ── SHARED SECTION ── */
.sec{padding:22px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.sec-title{font-family:'Manrope',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.35px}
.sec-link{font-size:13px;font-weight:700;color:var(--purple);cursor:pointer;white-space:nowrap}

/* ── SCROLL ROWS ── */
.scroll-row{display:flex;gap:12px;padding:0 16px;overflow-x:auto;overscroll-behavior-x:contain}
.scroll-row::-webkit-scrollbar{display:none}

/* ── EXPERIENCE CARDS ── */
.exp-card{flex-shrink:0;width:220px;border-radius:16px;background:var(--surface);
  border:1px solid var(--border2);overflow:hidden;cursor:pointer;position:relative}
.exp-img{height:130px;background-size:cover;background-position:center;position:relative}
.exp-chips{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
.exp-fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.exp-fav svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;transition:all .15s}
.exp-fav.on svg{fill:#e11d48;stroke:#e11d48}
.exp-body{padding:10px 11px 12px}
.exp-cat{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;margin-bottom:3px}
.exp-title{font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;line-height:1.25;margin-bottom:6px;color:var(--text)}
.exp-row{display:flex;align-items:center;justify-content:space-between}
.exp-rating{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text2)}
.exp-price{font-family:'DM Mono',monospace;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text)}

/* ── CHIPS ── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;
  font-family:'Manrope',sans-serif;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.chip-v{background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.3);color:#4ade80}
.chip-ex{background:rgba(168,85,247,.18);border:1px solid rgba(168,85,247,.4);color:#a855f7}
.chip-free{background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.3);color:#f59e0b}
.chip-pet{background:rgba(251,113,133,.13);border:1px solid rgba(251,113,133,.3);color:#fb7185}

/* ── GRID CARDS (Explore, Category, Members) ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.grid-card{border-radius:16px;background:var(--surface);border:1px solid var(--border2);overflow:hidden;cursor:pointer;position:relative}
.grid-img{height:110px;background-size:cover;background-position:center;position:relative}
.grid-body{padding:9px 10px 11px}

/* ── CATEGORY GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.cat-tile{border-radius:14px;overflow:hidden;cursor:pointer;position:relative;height:80px;
  display:flex;align-items:flex-end;padding:8px}
.cat-tile-name{font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;color:#fff;
  position:relative;z-index:1;line-height:1.2}

/* ── CTA BUTTON ── */
.btn-cta{width:100%;padding:16px;border-radius:14px;background:var(--cta);border:none;
  font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;color:#fff;cursor:pointer;letter-spacing:-.1px}
.btn-ghost{width:100%;padding:15px;border-radius:14px;background:var(--surface2);
  border:1px solid var(--border2);font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;color:var(--text);cursor:pointer}

/* ── VIBE PILLS ── */
.vibe-row{display:flex;gap:8px;padding:0 16px 4px;overflow-x:auto}
.vibe-row::-webkit-scrollbar{display:none}
.vibe-pill{flex-shrink:0;padding:7px 14px;border-radius:50px;border:1px solid var(--border2);
  background:var(--surface);font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;color:var(--text2)}
.vibe-pill.on{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.45);color:var(--purple)}

/* ── MEMBERS BANNER ── */
.members-banner{margin:0 16px;border-radius:20px;overflow:hidden;position:relative;cursor:pointer;
  height:150px;display:flex;align-items:flex-end;background:#0c0820}
.members-bg{position:absolute;inset:0;background:linear-gradient(135deg,#2d1b69,#6d28d9,#a855f7);opacity:.55}
.members-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.6),transparent)}
.members-content{position:relative;z-index:2;padding:16px 18px;width:100%;
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.members-eyebrow{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:50px;
  background:rgba(168,85,247,.20);border:1px solid rgba(168,85,247,.45);
  font-size:9px;font-weight:800;font-family:'Manrope',sans-serif;color:var(--amethyst);
  letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}
.members-title{font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:#fff;line-height:1.2}
.members-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px}
.members-btn{padding:9px 16px;border-radius:50px;background:var(--cta);font-family:'Manrope',sans-serif;
  font-size:11px;font-weight:800;color:#fff;cursor:pointer;border:none;flex-shrink:0}

/* ── SURPRISE CARD ── */
.surprise-card{margin:0 16px 4px;border-radius:18px;overflow:hidden;position:relative;cursor:pointer;
  height:100px;background:linear-gradient(135deg,#0d0020,#1a0040,#0a1830)}
.surprise-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0f0f1a,#1e1b4b,#312e81);opacity:.6}
.surprise-content{position:relative;z-index:2;padding:14px 18px;height:100%;
  display:flex;align-items:center;justify-content:space-between}
.surprise-eyebrow{font-size:9px;font-weight:800;font-family:'Manrope',sans-serif;
  text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.45)}
.surprise-title{font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;color:#fff;line-height:1.15}
.surprise-btn{padding:9px 16px;border-radius:30px;background:var(--cta);font-family:'Manrope',sans-serif;
  font-size:11px;font-weight:800;color:#fff;cursor:pointer;border:none;flex-shrink:0}

/* ── COLLECTION CARDS ── */
.col-card{flex-shrink:0;width:220px;border-radius:16px;background:var(--surface);
  border:1px solid var(--border2);overflow:hidden;cursor:pointer;position:relative}
.col-img{height:130px;background-size:cover;background-position:center}
.col-body{padding:10px 11px 12px}
.col-title{font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;color:var(--text);
  line-height:1.25;margin-bottom:3px}
.col-desc{font-size:11px;color:var(--text2);line-height:1.35}

/* ── DETAIL SCREEN ── */
.detail-hero{height:260px;position:relative;background-size:cover;background-position:center}
.detail-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,16,1) 0%,transparent 50%)}
.detail-hero-btns{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;
  display:flex;justify-content:space-between;align-items:center}
.detail-hero-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.detail-hero-btn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.detail-body{padding:0 16px 120px}
.detail-cat{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px;margin-top:16px}
.detail-title{font-family:'Manrope',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.4px;
  margin-bottom:6px;line-height:1.2}
.detail-host{font-size:13px;color:var(--text2);margin-bottom:12px}
.detail-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.detail-rating{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--text2)}
.detail-section{margin-bottom:20px}
.detail-section-title{font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;
  margin-bottom:10px;color:var(--text)}
.detail-desc{font-size:13.5px;color:var(--text2);line-height:1.6}
.include-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13px;color:var(--text2)}
.include-check{color:var(--green);font-weight:800;flex-shrink:0;margin-top:1px}
.detail-sticky{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--base);border-top:1px solid var(--border);
  padding:12px 16px max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.detail-price-block{flex:1}
.detail-from{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.detail-amount{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text)}
.detail-book-btn{flex:2;padding:15px;border-radius:14px;background:var(--cta);border:none;
  font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;color:#fff;cursor:pointer}
.detail-plans-btn{flex:1;padding:15px;border-radius:14px;background:var(--surface2);
  border:1px solid var(--border2);font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;
  color:var(--text);cursor:pointer}

/* ── BOOKING FLOW ── */
.booking-wrap{padding:16px 16px 120px}
.booking-step-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:16px}
.booking-step-dots{display:flex;gap:5px;margin-bottom:20px}
.step-dot{height:4px;flex:1;border-radius:2px;background:var(--border2)}
.step-dot.done{background:var(--emerald)}
.step-dot.on{background:var(--purple)}
.booking-mini{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--surface);
  border:1px solid var(--border2);margin-bottom:20px;align-items:center}
.booking-mini-img{width:50px;height:50px;border-radius:10px;flex-shrink:0}
.booking-mini-title{font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;color:var(--text)}
.booking-mini-sub{font-size:11px;color:var(--text2);margin-top:2px}
.booking-section-title{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;margin-bottom:12px}
/* Calendar */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month{font-family:'Manrope',sans-serif;font-size:14px;font-weight:800}
.cal-nav{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-nav svg{width:14px;height:14px;fill:none;stroke:var(--text);stroke-width:2}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:20px}
.cal-day-label{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:4px 0}
.cal-day{text-align:center;padding:8px 2px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--text2)}
.cal-day.today{color:var(--purple);font-weight:800}
.cal-day.sel{background:var(--cta);color:#fff;font-weight:800}
.cal-day.past{color:var(--text3);cursor:default}
.cal-day.sold{color:var(--text3);cursor:default;text-decoration:line-through}
.cal-day.avail:hover{background:var(--surface2)}
/* Time slots */
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.time-slot{padding:10px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--border2);
  text-align:center;font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;cursor:pointer;color:var(--text2)}
.time-slot.sel{background:rgba(139,92,246,.15);border-color:var(--purple);color:var(--purple)}
.time-slot.sold{color:var(--text3);cursor:default;text-decoration:line-through}
/* Guests */
.guest-counter{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-radius:14px;background:var(--surface);border:1px solid var(--border2);margin-bottom:16px}
.guest-info{font-family:'Manrope',sans-serif;font-size:14px;font-weight:700}
.guest-sub{font-size:11px;color:var(--text2);margin-top:2px}
.counter-row{display:flex;align-items:center;gap:12px}
.counter-btn{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:800;color:var(--text)}
.counter-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;min-width:24px;text-align:center}
/* Add-ons */
.addon-card{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-radius:14px;background:var(--surface);border:1px solid var(--border2);margin-bottom:8px;cursor:pointer}
.addon-info{flex:1}
.addon-title{font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;color:var(--text)}
.addon-desc{font-size:11px;color:var(--text2);margin-top:2px}
.addon-price{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);margin:0 12px}
.addon-toggle{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.addon-toggle.on{background:var(--purple);border-color:var(--purple)}
.addon-toggle.on::after{content:'✓';color:#fff;font-size:12px;font-weight:800}
/* Special requests */
.special-textarea{width:100%;padding:12px 14px;border-radius:14px;background:var(--surface);
  border:1px solid var(--border2);color:var(--text);font-family:'Manrope',sans-serif;font-size:13px;
  resize:none;outline:none;line-height:1.5}
/* Summary rows */
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--border)}
.summary-label{font-size:13px;color:var(--text2)}
.summary-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.summary-total{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
/* Payment */
.pay-tabs{display:flex;gap:6px;margin-bottom:16px}
.pay-tab{flex:1;padding:10px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--border2);
  font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;cursor:pointer;color:var(--text2);text-align:center}
.pay-tab.on{background:rgba(139,92,246,.14);border-color:var(--purple);color:var(--purple)}
.pay-input{width:100%;padding:13px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border2);color:var(--text);font-family:'DM Mono',monospace;font-size:14px;
  outline:none;margin-bottom:10px}
.pay-input::placeholder{color:var(--text3);font-family:'Manrope',sans-serif;font-size:13px}
.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-alt-btn{width:100%;padding:15px;border-radius:14px;background:var(--surface);
  border:1px solid var(--border2);font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
/* Sticky booking bar */
.booking-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--base);border-top:1px solid var(--border);
  padding:12px 16px max(20px,env(safe-area-inset-bottom))}
.booking-bar-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--text2)}
.booking-bar-amount{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--text)}

/* ── CONFIRMATION ── */
.confirm-wrap{display:flex;flex-direction:column;align-items:center;padding:40px 24px max(40px,env(safe-area-inset-bottom));min-height:100vh}
.confirm-check{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.15);
  border:2px solid rgba(34,197,94,.4);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.confirm-check svg{width:34px;height:34px;stroke:var(--green);fill:none;stroke-width:2.5}
.confirm-title{font-family:'Manrope',sans-serif;font-size:26px;font-weight:800;text-align:center;margin-bottom:6px}
.confirm-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:24px}
.confirm-card{width:100%;border-radius:20px;background:var(--surface);border:1px solid var(--border2);
  overflow:hidden;margin-bottom:20px}
.confirm-card-img{height:120px;background-size:cover;background-position:center}
.confirm-card-body{padding:16px}

// ROUTER
// ─────────────────────────────────────────────
const R = {
  stack: [],
  route: 'home',
  params: {},

  go(route, params={}) {
    this.stack.push({route:this.route, params:this.params});
    this.route = route;
    this.params = params;
    this.render();
    document.getElementById('screen').scrollTo(0,0);
  },

  back() {
    if(this.stack.length > 0) {
      const prev = this.stack.pop();
      this.route = prev.route;
      this.params = prev.params;
      this.render();
      document.getElementById('screen').scrollTo(0,0);
    }
  },

  refresh() {
    this.render(true);
  },

  render(soft=false) {
    const hide = ['book-1','book-2','book-3','confirmed','detail'];
    const nav = document.getElementById('bottom-nav');
    if(hide.includes(this.route)) { nav.style.display='none'; }
    else { nav.style.display='flex'; updateBottomNav(); }

    const screen = document.getElementById('screen');
    const builders = {
      'home':         screenHome,
      'explore':      screenExplore,
      'detail':       screenDetail,
      'book-1':       screenBook1,
      'book-2':       screenBook2,
      'book-3':       screenBook3,
      'confirmed':    screenConfirmed,
      'my-plans':     screenMyPlans,
      'profile':      screenProfile,
      'rewards':      screenRewards,
      'notifications':screenNotifications,
      'settings':     screenSettings,
      'category':     screenCategory,
      'collection':   screenCollection,
      'members-only': screenMembersOnly,
      'search':       screenSearch,
      'saved':        screenSaved,
      'payment-methods': screenPaymentMethods,
      'privacy':          screenPrivacy,
      'terms':            screenTerms,
      'security':         screenSecurity,
      'help':             screenHelp,
      'contact':          screenContact,
    };
    const builder = builders[this.route] || screenHome;
    screen.innerHTML = builder(this.params);
  }
};

function updateBottomNav() {
  const nav = document.getElementById('bottom-nav');
  const items = [
    {r:'home',     label:'Home',    icon:'<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'},
    {r:'explore',  label:'Explore', icon:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'},
    {r:'my-plans', label:'My Plans',icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
    {r:'profile',  label:'Profile', icon:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>'},
  ];
  const on = ['detail','book-1','book-2','book-3','confirmed','notifications','settings','category','collection','members-only','search','saved','payment-methods'];
  const activeRoot = on.includes(R.route) ? (R.stack.find(s=>['home','explore','my-plans','profile'].includes(s.route))?.route || 'home') : R.route;
  nav.innerHTML = items.map(it=>`
    <button class="nav-btn ${activeRoot===it.r?'on':''}" data-go="${it.r}">
      <svg viewBox="0 0 24 24">${it.icon}</svg>
      <span>${it.label}</span>
    </button>`).join('');
}

function sunSVG(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`; }
function backBtn(label=''){
  return `<button class="top-back" data-back><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>${label?`<span style="font-family:Manrope,sans-serif;font-size:16px;font-weight:800;flex:1">${label}</span>`:''}`;
}
function topBar(left, right=''){
  return `<div class="top-bar">${left}<div style="display:flex;gap:8px;align-items:center;margin-left:auto">${right}</div></div>`;
}
function formatDuration(min){ const h=Math.floor(min/60),m=min%60; return h>0?(m>0?`${h}h ${m}m`:`${h}h`):m+'m'; }
function gradStyle(grad){ return `background:${grad}`; }

function expCard(e, wide=false){
  const w = wide ? 'width:300px' : '';
  const bg = e.img ? 'background:url('+e.img+') center/cover,'+e.grad : 'background:'+e.grad;
  return `<div class="exp-card" style="${w}" data-go="detail" data-expid="${e.id}">
    <div class="exp-img" style="${bg}">
      <div class="exp-chips">${expChips(e)}</div>
      ${favBtn(e)}
    </div>
    <div class="exp-body">
      <div class="exp-cat" style="color:${CATS[e.category].color}">${CATS[e.category].label}</div>
      <div class="exp-title">${e.title}</div>
      <div class="exp-row">
        <div class="exp-rating">${starSVG()} ${e.rating} (${e.reviews})</div>
        <div class="exp-price">${e.free?'<span style="color:var(--amber);font-weight:800">FREE</span>':'From <span style="font-variant-numeric:tabular-nums">$'+e.price+'</span>'}</div>
      </div>
    </div>
  </div>`;
}

function gridCard(e){
  const gbg = e.img ? 'background:url('+e.img+') center/cover,'+e.grad : 'background:'+e.grad;
  return `<div class="grid-card" data-go="detail" data-expid="${e.id}">
    <div class="grid-img" style="${gbg}">
      <div style="position:absolute;top:7px;left:7px;display:flex;gap:4px">${expChips(e)}</div>
      ${favBtn(e)}
    </div>
    <div class="grid-body">
      <div class="exp-cat" style="color:${CATS[e.category].color};font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;margin-bottom:3px">${CATS[e.category].label}</div>
      <div style="font-family:Manrope,sans-serif;font-size:12.5px;font-weight:800;line-height:1.25;margin-bottom:4px;color:var(--text)">${e.title}</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text2)">${starSVG()} ${e.rating}</div>
        <div style="font-family:DM Mono,monospace;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text)">${e.free?'<span style="color:var(--amber);font-weight:800">FREE</span>':'$'+e.price}</div>
      </div>
    </div>
  </div>`;
}

function toast(msg, dur=1800){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, dur);
}

// SCREEN: BOOKING STEP 1 (Date + Time)
// ─────────────────────────────────────────────
function screenBook1(p={}) {
  const e = EXP.find(x=>x.id===p.id) || EXP.find(x=>x.id===S.booking.expId) || EXP[0];
  // Reset state when starting a booking for a new experience
  if(p.id && p.id !== S.booking.expId) {
    S.booking.expId = p.id;
    S.booking.date = null;
    S.booking.time = null;
    S.booking.addons = [];
    S.booking.requests = '';
    const now = new Date();
    S.booking.calYear  = now.getMonth()===11 ? now.getFullYear()+1 : now.getFullYear();
    S.booking.calMonth = (now.getMonth()+1) % 12;
  } else {
    if(!S.booking.expId) S.booking.expId = e.id;
    if(!S.booking.calYear) {
      const now = new Date();
      S.booking.calYear  = now.getMonth()===11 ? now.getFullYear()+1 : now.getFullYear();
      S.booking.calMonth = (now.getMonth()+1) % 12;
    }
  }

  const y = S.booking.calYear, m = S.booking.calMonth;
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const daysInMonth = new Date(y,m+1,0).getDate();
  const firstDay = new Date(y,m,1).getDay();
  const today = new Date(); today.setHours(0,0,0,0);
  const sold = [3,8,15,22];

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += '<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dt = new Date(y,m,d);
    const isPast = dt < today;
    const isSold = sold.includes(d);
    const dStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isSel = S.booking.date === dStr;
    let cls = 'cal-day';
    let attr = '';
    if(isPast)      cls += ' past';
    else if(isSold) cls += ' sold';
    else if(isSel)  cls += ' sel';
    else { cls += ' avail'; attr = ' data-action="pick-date" data-date="'+dStr+'"'; }
    cells += '<div class="'+cls+'"'+attr+'>'+d+'</div>';
  }

  const TIME_BY_CAT = {
    dining:    ['6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM'],
    wellness:  ['7:00 AM','8:00 AM','9:00 AM','10:00 AM','11:00 AM','3:00 PM'],
    outside:   ['7:00 AM','8:00 AM','9:00 AM','10:00 AM','11:00 AM','3:00 PM'],
    offshore:  ['8:00 AM','9:00 AM','10:00 AM','1:00 PM','3:00 PM','4:00 PM'],
    adventure: ['8:00 AM','9:00 AM','10:00 AM','1:00 PM','3:00 PM','4:00 PM'],
  };
  const slots = TIME_BY_CAT[e.category] || ['11:00 AM','12:00 PM','1:00 PM','2:00 PM','4:00 PM','6:00 PM'];
  const soldSlots = [slots[1], slots[4]];

  let timeGrid = '';
  for(let i=0;i<slots.length;i++){
    const t = slots[i];
    const isSold = soldSlots.includes(t);
    const isSel  = S.booking.time === t;
    let cls = 'time-slot';
    if(isSold)     cls += ' sold';
    else if(isSel) cls += ' sel';
    if(isSold) timeGrid += '<button class="'+cls+'" disabled>'+t+'</button>';
    else       timeGrid += '<button class="'+cls+'" data-action="pick-time" data-time="'+t+'">'+t+'</button>';
  }

  const canContinue = !!(S.booking.date && S.booking.time);
  const selLabel = S.booking.date
    ? new Date(S.booking.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})
    : '';
  const barLabel = canContinue ? selLabel+' at '+S.booking.time : 'Select a date and time';

  return '<div class="top-bar">'
    +'<button class="top-back" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>'
    +'<span style="font-family:Manrope,sans-serif;font-size:16px;font-weight:800;flex:1">Date and Time</span>'
    +'</div>'
    +'<div class="booking-wrap">'
    +'<div class="booking-step-dots"><div class="step-dot on"></div><div class="step-dot"></div><div class="step-dot"></div></div>'
    +'<div class="booking-mini"><div class="booking-mini-img" style="'+gradStyle(e.grad)+'"></div>'
    +'<div><div class="booking-mini-title">'+e.title+'</div><div class="booking-mini-sub">'+e.city+' · '+formatDuration(e.duration)+'</div></div></div>'
    +'<div class="booking-section-title">Select a Date</div>'
    +'<div style="background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:14px;margin-bottom:20px">'
    +'<div class="cal-header">'
    +'<button class="cal-nav" data-action="cal-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>'
    +'<div class="cal-month">'+MONTHS[m]+' '+y+'</div>'
    +'<button class="cal-nav" data-action="cal-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>'
    +'</div>'
    +'<div class="cal-grid">'
    +'<div class="cal-day-label">S</div><div class="cal-day-label">M</div><div class="cal-day-label">T</div>'
    +'<div class="cal-day-label">W</div><div class="cal-day-label">T</div><div class="cal-day-label">F</div><div class="cal-day-label">S</div>'
    +cells
    +'</div></div>'
    +'<div class="booking-section-title">Select a Time'+(selLabel?' — '+selLabel:'')+'</div>'
    +'<div class="time-grid">'+timeGrid+'</div>'

// EVENT DELEGATION
// ─────────────────────────────────────────────
document.addEventListener('click', function(e) {
  // Favorite — must be checked BEFORE data-go (hearts live inside cards that also have data-go)
  const favEl = e.target.closest('[data-fav]');
  if(favEl) {
    e.stopPropagation();
    const id = favEl.dataset.fav;
    toggleFav(id);
    favEl.classList.toggle('on', isFav(id));
    const svg = favEl.querySelector('svg');
    if(svg){ svg.setAttribute('fill', isFav(id)?'#e11d48':'none'); svg.setAttribute('stroke', isFav(id)?'#e11d48':'white'); }
    toast(isFav(id)?'Saved':'Removed from Saved');
    return;
  }
  // Back
  if(e.target.closest('[data-back]')) { R.back(); return; }
  // Theme toggle
  if(e.target.closest('[data-theme-toggle]')) { toggleTheme(); R.refresh(); return; }
  // Navigate
  const goEl = e.target.closest('[data-go]');
  if(goEl) {
    const route = goEl.dataset.go;
    let params = {};
    try { params = goEl.dataset.params ? JSON.parse(goEl.dataset.params) : {}; } catch(_){}
    if(goEl.dataset.expid)  params.id  = goEl.dataset.expid;
    if(goEl.dataset.colid)  params.id  = goEl.dataset.colid;
    if(goEl.dataset.cat && !goEl.dataset.go.includes('explore')) params.cat = goEl.dataset.cat;
    R.go(route, params);
    return;
  }
  // Vibe filter on home
  const vibeEl = e.target.closest('[data-vibe]');
  if(vibeEl) {
    document.querySelectorAll('[data-vibe]').forEach(b=>b.classList.remove('on'));
    vibeEl.classList.add('on');
    const v = vibeEl.dataset.vibe;
    S.explore.vibe = v==='all'?'all':v;
    return;
  }
  // Category filter in explore
  const catEl = e.target.closest('[data-cat]');
  if(catEl) {
    S.explore.cat = catEl.dataset.cat;
    R.refresh();
    return;
  }
  // Explore vibe filter
  const evEl = e.target.closest('[data-explore-vibe]');
  if(evEl) {
    S.explore.vibe = evEl.dataset.exploreVibe;
    R.refresh();
    return;
  }
  // Actions
  const actionEl = e.target.closest('[data-action]');
  if(actionEl) {
    handleAction(actionEl.dataset.action, actionEl.dataset, e);
    return;
  }
});

// Input event for search
document.addEventListener('input', function(e) {
  if(e.target.id==='explore-search') {
    S.explore.query = e.target.value;
    R.refresh();
  }
  if(e.target.id==='special-req') {
    S.booking.requests = e.target.value;
  }
  if(e.target.id==='card-num') {
    let v = e.target.value.replace(/\D/g,'').slice(0,16);
    e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
  }
  if(e.target.id==='card-exp') {
    let v = e.target.value.replace(/\D/g,'');
    if(v.length>=2) v = v.slice(0,2)+' / '+v.slice(2,4);
    e.target.value = v;
  }
});

function handleAction(action, data, e) {
  switch(action) {
    case 'surprise': {
      const pool = EXP.filter(e=>!e.free);
      const pick = pool[Math.floor(Math.random()*pool.length)];
      toast('Tonight: '+pick.title);
      setTimeout(()=>R.go('detail',{id:pick.id}), 400);
      break;
    }
    case 'pick-date':
      S.booking.date = data.date;
      R.refresh();
      break;
    case 'pick-time':
      S.booking.time = data.time;
      R.refresh();
      break;
    case 'cal-prev':
      if(S.booking.calMonth===0){ S.booking.calMonth=11; S.booking.calYear--; }
      else S.booking.calMonth--;
      R.refresh();
      break;
    case 'cal-next':
      if(S.booking.calMonth===11){ S.booking.calMonth=0; S.booking.calYear++; }
      else S.booking.calMonth++;
      R.refresh();
      break;
    case 'book-next-1':
      if(!S.booking.date || !S.booking.time) { toast('Please select a date and time to continue.'); return; }
      R.go('book-2');
      break;
    case 'guests-dec':
      if(S.booking.guests>1){ S.booking.guests--; R.refresh(); }
      break;
    case 'guests-inc':
      if(S.booking.guests<10){ S.booking.guests++; R.refresh(); }
      break;
    case 'toggle-addon': {
      const aid = data.addon;
      const i = S.booking.addons.indexOf(aid);
      if(i>-1) S.booking.addons.splice(i,1); else S.booking.addons.push(aid);
      R.refresh();
      break;
    }
    case 'book-next-2':
      S.booking.requests = document.getElementById('special-req')?.value || '';
      R.go('book-3');
      break;
    case 'pay-tab':
      S.booking.payment = data.tab;
      R.refresh();
      break;
    case 'pay-alt':
      toast('Opening '+S.booking.payment.charAt(0).toUpperCase()+S.booking.payment.slice(1)+' Pay...');
      setTimeout(()=>R.go('confirmed'),1200);
      break;
    case 'confirm-pay':
      toast('Processing payment...');
      setTimeout(()=>R.go('confirmed'),1200);
      break;
    case 'add-plans': {
      const exp = EXP.find(x=>x.id===data.id);
      if(exp) toast('"'+exp.title+'" added to My Plans');
      break;
    }
    case 'add-to-cal':
      toast('Added to Calendar');
      break;
    case 'share': {
      const msgs = {Text:'Opening Messages...',Instagram:'Opening Instagram...',Snapchat:'Opening Snapchat...',X:'Opening X...'};
      if(data.platform==='Copy Link'){ toast('Link copied!'); }
      else toast(msgs[data.platform]||'Sharing...');
      break;
    }
    case 'plans-tab':
      S.plans.tab = data.tab;
      R.refresh();
      break;
    case 'rewards-period':
      S.rewards.period = data.period;
      R.refresh();
      break;
    case 'toggle-tier': {
      const tid = data.tier;
      S.rewards.tiers[tid] = !S.rewards.tiers[tid];
      R.refresh();
      break;
    }
    case 'stat-detail': {
      const msgs = {
        experiences:{month:'3 experiences completed this month.',quarter:'9 experiences this quarter.',year:'12 experiences this year.'},
        points:{month:'889 points earned this month.',quarter:'2,640 points earned this quarter.',year:'3,820 points earned this year. Points never expire.'},
        categories:{month:'Dining, Offshore, and Arts explored this month.',quarter:'5 categories explored this quarter.',year:'6 of 7 categories this year. Missing: Kid-Friendly.'},
      };
      toast((msgs[data.type]||{})[data.period]||'', 3000);
      break;
    }
    case 'redeem':
      toast('Redeeming: '+data.title+' for '+data.pts+' pts', 2000);
      setTimeout(()=>toast('Redemption confirmed.'),2200);
      break;
    case 'earn-info':
      toast(data.title, 2000);
      break;
    case 'ledger-tap':
      toast(data.title, 2000);
      break;
    case 'mark-all-read':
      S.notifCount = 0;
      toast('All notifications marked as read');
      R.refresh();
      break;
    case 'notif-tap':
      break;
    case 'edit-field':
      const val = prompt('Update '+data.field+':');
      if(val) toast(data.field+' updated');
      break;
    case 'toggle-setting':
      S.settings[data.key] = !S.settings[data.key];
      R.refresh();
      break;
    case 'toggle-pref':
      if(e) e.target.style.background = e.target.style.background==='var(--surface2)'?'rgba(139,92,246,.15)':'var(--surface2)';
      break;
    case 'cat-filter':
      toast(data.filter+' filter applied');
      break;
    case 'invite-friend':
    case 'copy-code':
      toast('Code WTM-J4K91 copied to clipboard.');
      if(navigator.clipboard) navigator.clipboard.writeText('WTM-J4K91').catch(()=>{});
      break;
    case 'share-referral': {
      const msgs2 = {Text:'Opening Messages...',Instagram:'Opening Instagram...',Snapchat:'Opening Snapchat...',X:'Opening X...',WhatsApp:'Opening WhatsApp...'};
      if(data.platform==='Copy Link'){ toast('Referral link copied.'); }
      else toast(msgs2[data.platform]||'Sharing...');
      break;
    }
    case 'sign-out':
      toast('Signed out');
      setTimeout(()=>R.go('home'),1000);
      break;
    case 'legal':
      toast('Opening '+data.page+'...');
      break;
    case 'add-card':
      toast('Add payment method coming soon.');
      break;
    case 'toggle-faq': {
      const el = document.getElementById(data.faq+'-body');
      if(el) { el.style.display = el.style.display==='none'?'block':'none'; }
      break;
    }
    case 'submit-support':
      toast('Request submitted. We\'ll respond within 2 hours.');
      setTimeout(()=>R.back(), 1800);
      break;
    case 'start-chat':
      toast('Connecting to live support...');
      break;
    case 'search-input':
      break;
  }
}

function openConcierge() {
  const input = prompt('AI Concierge\n\nDescribe what you have in mind:\n\nExample: "Rooftop dinner for two, private chef, somewhere with a city view."');
  if(input && input.trim()) toast('Request received. We will plan your experience.', 2500);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
R.render();
</script>
</html>
